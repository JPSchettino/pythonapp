<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.7.2/dist/themes/classic.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.7.2/dist/pickr.min.js"></script>
    <style>
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 400px; /* ajuste o valor de acordo com o tamanho desejado */
            height: auto; /* para manter a proporção da imagem */
        }
        body {
            font-family: 'Sora', Light;
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #19B1A1, #307FE2);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }
        .container {
            text-align: center;
            max-width: 200%;
            margin-bottom: 20px;
            margin-top: 150px;
            background: rgba(182, 116, 116, 0.7);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px 0px rgba(0,0,0,0.1);
            overflow-x: auto;
            top: 80px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
        }
        a {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #307FE2;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.5s ease;
        }
        a:hover {
            background-color: #19B1A1;
        }
    </style>
</head>
<body>
    <header>
        <img class = "logo" src="static\logo_preferencial_FOODTEST.png" alt="Logo da Empresa">
    </header>
    <div class="container">
        <h1>Mapa de correlação (filtrado por {{ filters_string }})</h1>
        <img src="data:image/png;base64,{{ corrgraf }}" alt="Clustermap" width="3800">
    </div> <!-- Fecha a div do container -->
</body>
</html>
