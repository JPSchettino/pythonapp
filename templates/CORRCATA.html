<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.7.2/dist/themes/classic.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.7.2/dist/pickr.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #1de099, #1dc8cd);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }
        .container {
            text-align: center;
            max-width: 200%;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px 0px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
        }
        a {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #1dc8cd;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.5s ease;
        }
        a:hover {
            background-color: #1de099;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mapa de correlação (filtrado por {{ filters_string }})</h1>
        <img src="data:image/png;base64,{{ corrgraf }}" alt="Clustermap" width="1800">
    </div> <!-- Fecha a div do container -->
</body>
</html>
