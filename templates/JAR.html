<!DOCTYPE html>
<html>
<head>
    <title>JAR Page</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 300px;
            height: auto;
        }
        body {
            font-family: 'Sora', Light;
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #ffffff, #ffffff);
            color: rgb(12, 1, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
            margin-bottom: 20px;
        }
        .chartContainer {
            text-align: center;
            max-width: 80%;
            margin-bottom: 20px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px 0px rgba(0,0,0,0.3);
            overflow-x: auto;
            top: 80px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
        }
        a {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #fdfdfd;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.5s ease;
        }
        a:hover {
            background-color: #19B1A1;
        }
        select {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            box-shadow: 0px 2px 6px 1px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            color: #333;
            background-color: white;
            margin-right: 20px;
            transition: all 0.3s ease;
        }

        select:focus {
            box-shadow: 0px 2px 6px 1px #19B1A1;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: #19B1A1;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #307FE2;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #colorPickers {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 20px;
        }

        #colorPickers label {
            margin: 5px 0;
        }

        .category-selector {
            margin-top: 20px;
            max-width: 80%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-checkbox-wrapper {
            margin: 5px 15px;
        }
    </style>
</head>
<body>
    <header>
        <img class="logo" src="static/logo_preferencial_FOODTEST1.jpg" alt="Logo da Empresa">
    </header>
    <h1 id="filtersHeader">Gráfico JAR</h1>
    <div class="controls">
        <select id="variableDropdown1"></select>
        <select id="variableDropdown2"></select>
        <button id="updateGraph">Atualizar gráfico</button>
        <button id="saveButton">Salvar como PNG</button>
    </div>
    <div id="categorySelector" class="category-selector"></div>
    <div id="colorPickers">
        <label for="color1">Muito abaixo do ideal:</label>
        <input type="color" id="color1" name="color1" value="#9AD8E6">
        <label for="color2">Abaixo do ideal:</label>
        <input type="color" id="color2" name="color2" value="#74A1DB">
        <label for="color3">Ideal:</label>
        <input type="color" id="color3" name="color3" value="#fcec74">
        <label for="color4">Acima do ideal:</label>
        <input type="color" id="color4" name="color4" value="#F0A6E9">
        <label for="color5">Muito acima do ideal:</label>
        <input type="color" id="color5" name="color5" value="#FF309E">
    </div>
    <div>
        <label for="color6">Cor do título:</label>
        <input type="color" id="color6" name="color6" value="#000000">
        <label for="color7">Cor do subtítulo:</label>
        <input type="color" id="color7" name="color7" value="#000000">
        <label for="color8">Cor do rótulo:</label>
        <input type="color" id="color8" name="color8" value="#000000">
    </div>
    <div id="chartContainer">
        <img id="chartImage" src="" alt="Clustermap">
    </div>

    <script>
        function updateDropdowns(selectedVariable1, selectedVariable2) {
            $.get("/get_variables", function(data) {
                $('#variableDropdown1').empty().append('<option value="">Nenhum</option>');
                $('#variableDropdown2').empty().append('<option value="">Nenhum</option>');
                for (var i = 0; i < data.length; i++) {
                    if (data[i] !== selectedVariable2) {
                        $('#variableDropdown1').append('<option value="' + data[i] + '">' + data[i] + '</option>');
                    }
                    if (data[i] !== selectedVariable1) {
                        $('#variableDropdown2').append('<option value="' + data[i] + '">' + data[i] + '</option>');
                    }
                }
                $('#variableDropdown1').val(selectedVariable1);
                $('#variableDropdown2').val(selectedVariable2);
                updateCategorySelector(selectedVariable1);
            });
        }

        function updateCategorySelector(variable) {
            $('#categorySelector').empty();
            if (variable && variable !== "Nenhum") {
                $.get("/get_categories", { variable: variable }, function(data) {
                    data.forEach(function(category) {
                        $('#categorySelector').append(
                            '<div class="category-checkbox-wrapper"><input type="checkbox" class="category-checkbox" value="' + category + '"> ' + category + '</div>'
                        );
                    });
                });
            }
        }

        $(document).ready(function() {
            $.get("/get_variables", function(data) {
                if (data.length > 1) {
                    updateDropdowns(data[0], data[1]);
                }
            });

            $('#variableDropdown1').change(function() {
                var selectedVariable1 = $(this).val();
                var selectedVariable2 = $('#variableDropdown2').val();
                updateDropdowns(selectedVariable1, selectedVariable2);
            });

            $('#variableDropdown2').change(function() {
                var selectedVariable1 = $('#variableDropdown1').val();
                var selectedVariable2 = $(this).val();
                updateDropdowns(selectedVariable1, selectedVariable2);
            });

            $('#updateGraph').click(function() {
                var selectedVariable1 = $('#variableDropdown1').val();
                var selectedVariable2 = $('#variableDropdown2').val();
                var selectedCategories = $('.category-checkbox:checked').map(function() {
                    return this.value;
                }).get();
                var colors = {
                    "muito abaixo do ideal": $('#color1').val(),
                    "abaixo do ideal": $('#color2').val(),
                    "ideal": $('#color3').val(),
                    "acima do ideal": $('#color4').val(),
                    "muito acima do ideal": $('#color5').val()
                };
                var colorTitulo = $('#color6').val();
                var colorSubtitulo = $('#color7').val();
                var colorRotulo = $('#color8').val();

                $.ajax({
                    url: '/JAR',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        selectedVariable1: selectedVariable1,
                        selectedVariable2: selectedVariable2,
                        selectedCategories: selectedCategories,
                        colors: colors,
                        colorTitulo: colorTitulo,
                        colorSubtitulo: colorSubtitulo,
                        colorRotulo: colorRotulo
                    }),
                    dataType: 'json',
                    success: function(data) {
                        $('#chartImage').attr('src', 'data:image/png;base64,' + data.corrgraf);
                        $('#filtersHeader').text('Gráficos JAR (filtrados por ' + data.filters_string + ')');
                        updateDropdowns(selectedVariable1, selectedVariable2);
                    }
                });
            });
        });

        document.getElementById("saveButton").addEventListener("click", function() {
            var imgElement = document.getElementById('chartImage');

            var selectedVariable1 = $('#variableDropdown1').val();
            var selectedVariable2 = $('#variableDropdown2').val();

            var filters_string = $('#filtersHeader').text().split(' ')[3];

            var filename = 'JARPLOT_' + filters_string + '_' + selectedVariable1 + '_' + selectedVariable2 + '.png';

            fetch(imgElement.src)
                .then(response => response.blob())
                .then(blob => {
                    var url = window.URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                });
        });
    </script>
</body>
</html>
