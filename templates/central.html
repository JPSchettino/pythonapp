<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .logo {
            position: absolute;
            top: 80px;
            left: 49.3%;
            transform: translate(-50%, -50%);
            width: 300px; /* ajuste o valor de acordo com o tamanho desejado */
            height: auto; /* para manter a proporção da imagem */
        }
        body {
            font-family: 'Sora', Light;
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #19B1A1, #307FE2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        ul {
            list-style-type: none;
        }
        ul li {
            margin: 35px 0;
        }
        a {
            color: white;
            background: #282828;
            padding: 15px 35px;
            border-radius: 6px;
            text-decoration: none;
            transition: background .3s ease;
        }
        a:hover {
            background: #383838;
        }
    </style>
</head>
<body>
    <header>
        <img class = "logo" src="static\logo_preferencial_FOODTEST.png" alt="Logo da Empresa">
    </header>
    <div class="container">
        <h1>Bem-vindo ao nosso serviço de análise de dados!</h1>
        <ul>
            <li><a href="/teste">Ver Resultados de Testes</a></li>
            <li><a href="/resumo">Ver Resumo</a></li>
            <li><a href="/graficos">Ver Gráficos</a></li>
            <li><a href="/JAR">Ver Gráfico JAR</a></li>
            <li><a href="/CORRCATA">Ver Correlação CATA</a></li>
            <li><a href="/prefint">Ver preferencia interna</a></li>
        </ul>
    </div>
</body>
</html>
