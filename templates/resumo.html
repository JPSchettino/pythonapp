<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Resumo dos Dados</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script lang="javascript" src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #1de099, #1dc8cd);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: auto;
        }
        .container {
            text-align: center;
            overflow-x: auto;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            color: #282828;
        }
        th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: center;
            background-color: #1de099;
            color: white;
        }
        button {
            color: white;
            background: #282828;
            padding: 15px 25px;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #383838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resumo dos Dados (filtrados por {{ filters_string }})</h1>

        <button onclick="copyTableToClipboard()">Copiar Tabela</button>
        <button onclick="exportTableToExcel()">Exportar Tabela (Excel)</button>


        {{ summary_html | safe }}
    </div>
    <script>
        async function copyTableToClipboard() {
            var tableText = '';
            var rows = document.querySelectorAll('table tr');

            for (var i = 0; i < rows.length; i++) {
                var rowText = '';
                var cols = rows[i].querySelectorAll('td, th');

                for (var j = 0; j < cols.length; j++) 
                    rowText += cols[j].innerText + '\t';
                
                tableText += rowText.trim() + '\n'; 
            }

            try {
                await navigator.clipboard.writeText(tableText.trim());
                console.log('Table copied to clipboard');
            } catch (err) {
                console.error('Failed to copy table: ', err);
            }
        }

        function exportTableToExcel() {
                    var wb = XLSX.utils.book_new();
                    var ws = XLSX.utils.table_to_sheet(document.querySelector('table'));
                    XLSX.utils.book_append_sheet(wb, ws, "Resumo");
                    XLSX.writeFile(wb, "resumo.xlsx");
                }
    </script>
</body>
</html>
