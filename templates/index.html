<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplicação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-beta.1/dist/js/select2.min.js"></script>
    <style>
       body {

}

.form-control::placeholder, .form-select::placeholder {

}
.select2-dropdown {

    color: rgb(255, 255, 255);
    border-radius: .25rem;
    color: white;
    padding: 0 10px;
    margin-top: 2px;
}

.select2-results__option {
    color: rgb(255, 255, 255);
    border-radius: .25rem;
    color: white;
    padding: 0 10px;
    margin-top: 2px;
}

.select2-results__option--highlighted {
    background-color: #307FE2;
    color: #282828;
    border-radius: .25rem;
    color: white;
    padding: 0 10px;
    margin-top: 2px;
}
.logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 400px; /* ajuste o valor de acordo com o tamanho desejado */
            height: auto; /* para manter a proporção da imagem */
        }
    </style>
<script>
    $(document).ready(function() {
                function createFilterOptions(id, isCategorical, levels) {
                            let filterOptions = '';

                            if (isCategorical) {
                                levels.forEach(function (level) {
                                    filterOptions += `
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="${id}-checkbox" value="${level}" data-variable="${id}">
                                            <label class="form-check-label">${level}</label>
                                        </div>
                                    `;
                                });
                            } else {
                                filterOptions = '<label>Lower Bound: <input type="number" name="' + id + '-lower" step="any"></label><br>';
                                filterOptions += '<label>Upper Bound: <input type="number" name="' + id + '-upper" step="any"></label><br>';
                            }

                            return `<div class="filter" id="${id}Filter" data-categorical="${isCategorical}">${filterOptions}</div>`;
        }



            function updateFilterColumn(id) {
    const columnName = $(`#${id}`).val();
    const filterDiv = $(`#${id}Filter`);
    const filterSelect = $(`#${id}`);

    if (!columnName) {
        filterDiv.empty();
        filterSelect.attr('data-categorical', 'false');
        return;
    }

    $.ajax({
        url: '/get_filter_options',
        type: 'POST',
        data: { column: columnName },
        success: function (data) {
            const filterOptions = createFilterOptions(id, data.is_categorical, data.levels);
            filterDiv.html(filterOptions);
            filterSelect.attr('data-categorical', data.is_categorical);
        }
    });
}


function applyFilter() {
    let filters = {};

    for (let i = 1; i <= 3; i++) {
        const filterVar = $(`#filterVar${i}`).val();
        if (filterVar) {
            const filterDiv = $(`#${filterVar}Filter`);
            const isCategorical = $(`#filterVar${i}`).attr('data-categorical') === 'true';

            if (isCategorical) {
                filters[filterVar] = {
                    type: "categorical",
                    values: []
                };
                $('input[type="checkbox"][data-variable="filterVar' + i + '"]:checked').each(function () {
                    filters[filterVar].values.push($(this).val());
                });
            } else {
                const lowerBound = filterDiv.find(`input[name="${filterVar}-lower"]`).val() || null;
                const upperBound = filterDiv.find(`input[name="${filterVar}-upper"]`).val() || null;
                filters[filterVar] = {
                    type: "numerical",
                    lowerBound: lowerBound !== null ? parseFloat(lowerBound) : null,
                    upperBound: upperBound !== null ? parseFloat(upperBound) : null
                };
            }
        }
    }

    console.log(filters);

    $.ajax({
        url: '/apply_filter',
        type: 'POST',
        data: { filters: JSON.stringify(filters) },
        success: function (data) {
            // Atualizar tabela/gráfico com base nos dados filtrados
        }
    });
}

        $("#inputFile").change(function() {
            let formData = new FormData();
            formData.append('inputFile', this.files[0]);

            $.ajax({
                url: '/get_columns',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(data) {
                    let options = '<option value="">Selecione uma variável</option>';
                    data.columns.forEach(col => {
                        options += `<option value="${col}">${col}</option>`;
                    });

                    $("#filterVar1, #filterVar2, #filterVar3").html(options);
                }
            });
        });

        $("#filterVar1, #filterVar2, #filterVar3").change(function() {
            updateFilterColumn(this.id);
        });
        $("#inputFile").change(function() {
            let formData = new FormData();
            formData.append('inputFile', this.files[0]);

            $.ajax({
                url: '/get_columns',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(data) {
                    let options = '<option value="">Selecione uma variável</option>';
                    data.columns.forEach(col => {
                        options += `<option value="${col}">${col}</option>`;
                    });

                    $("#catVar1, #catVar2, #catVar3,#catVar4, #numVar1,#JAR1, #CATAVar1").html(options);
                }
            });
        });

        $("#filterButton").click(function () {
            applyFilter();
            console.log("Filtro aplicado!");
        });
        $('#numVar1').select2({
        placeholder: "Selecione as variáveis",
        allowClear: true
    });
    $('#JAR1').select2({
        placeholder: "Selecione as variáveis",
        allowClear: true
    });



    var isMouseInFormContainer = false;
$('.form-container').mouseenter(function(e) {
    isMouseInFormContainer = true;
}).mouseleave(function(e) {
    isMouseInFormContainer = false;
});

$('body').mousemove(function(e) {
    if (isMouseInFormContainer) {
        var formContainer = $('.form-container')[0];
        var rect = formContainer.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        if (x >= 0 && y >= 0 && x <= rect.width && y <= rect.height) {
            var newColor = 'rgb(' + (x / rect.width * 255) + ',' + (y / rect.height * 255) + ', 100)';
            $('body').css('background-color', newColor);
        }
    }
});

    });
    $("#clearFiltersButton").click(function () {
    // Limpa as opções de filtro selecionadas
    $("#filterVar1, #filterVar2, #filterVar3").val('').trigger('change');
    
    // Limpa o conteúdo das divisões de filtro
    $("#filterVar1Filter, #filterVar2Filter, #filterVar3Filter").empty();
    
    console.log("Filtros limpos!");
});
$("#CATAVar1").off('change').on('change', function() {
        // Obtém todas as opções no select
        let options = $(this).find('option');

        // Descobre os índices das opções selecionadas
        let selectedIndices = $(this).find('option:selected').toArray().map(function(option) {
            return options.index(option);
        });

        // Se menos de 2 opções estiverem selecionadas, não faz nada
        if (selectedIndices.length < 2) return;

        // Descobre as opções mínima e máxima selecionadas
        let minSelectedIndex = Math.min(...selectedIndices);
        let maxSelectedIndex = Math.max(...selectedIndices);

        // Seleciona todas as opções entre minSelectedIndex e maxSelectedIndex
        for (let i = minSelectedIndex; i <= maxSelectedIndex; i++) {
            options.eq(i).prop('selected', true);
        }

        // Atualiza o seletor para refletir as mudanças
        $(this).trigger('change.select2');
    });
</script>
</head>
<body>
    <header>
        <img class = "logo" src="static\logo_preferencial_FOODTEST.png" alt="Logo da Empresa">
    </header>
    <div class="form-container">
        <h1>Upload do arquivo Excel</h1>
        <form action="{{ url_for('central') }}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="inputFile" class="form-label">Selecione o arquivo:</label>
                <input type="file" class="form-control" id="inputFile" name="inputFile" accept=".xls,.xlsx" required>
            </div>
            <!-- Filter options start -->
            <div class="mb-3">
                <label for="filterVar1" class="form-label">Variável de filtro 1:</label>
                <select class="form-select" id="filterVar1" name="filterVar1" data-categorical="true"></select>
                <div id="filterVar1Filter"></div>
                
            </div>
            <div class="mb-3">
                <label for="filterVar2" class="form-label">Variável de filtro 2:</label>
                <select class="form-select" id="filterVar2" name="filterVar2" data-categorical="true"></select>
                <div id="filterVar2Filter"></div>
            </div>
            <div class="mb-3">
                <label for="filterVar3" class="form-label">Variável de filtro 3:</label>
                <select class="form-select" id="filterVar3" name="filterVar3"data-categorical="true"></select>
                <div id="filterVar3Filter"></div>
            </div>
            <button type="button" class="btn btn-primary mb-3" id="filterButton">Filtrar</button>
            <button type="button" class="btn btn-secondary mb-3" id="clearFiltersButton">Limpar Filtros</button>
            <!-- Filter options end -->
            <div class="mb-3">
                <label for="catVar1" class="form-label">Variável categórica 1:</label>
                <select class="form-select" id="catVar1" name="catVar1"></select>
            </div>
            <div class="mb-3">
                <label for="catVar2" class="form-label">Variável categórica 2:</label>
                <select class="form-select" id="catVar2" name="catVar2"></select>
            </div>
            <div class="mb-3">
                <label for="catVar3" class="form-label">Variável categórica 3:</label>
                <select class="form-select" id="catVar3" name="catVar3"></select>
            </div>
            <div class="mb-3">
                <label for="catVar4" class="form-label">Variável categórica 4:</label>
                <select class="form-select" id="catVar4" name="catVar4"></select>
            </div>
            <div class="mb-3">
                <label for="numVar1" class="form-label">Variável numérica:</label>
                <select multiple class="form-select" id="numVar1" name="numVar1[]"></select>
            </div>
            <div class="mb-3">
                <label for="JAR1" class="form-label">Variável JAR:</label>
                <select multiple class="form-select" id="JAR1" name="JAR1[]"></select>
            </div>
            <div class="mb-3">
                <label for="CATAVar1" class="form-label">Variáveis CATA:</label>
                <select multiple class="form-select" id="CATAVar1" name="CATAVar1[]"></select>
            </div>
            <br>
            <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>
</body>
</html>
